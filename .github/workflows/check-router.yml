name: check-router

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump check compares against origin/main and skips itself if that ref is missing.
          fetch-depth: 0
      - run: sh scripts/check-router.sh
