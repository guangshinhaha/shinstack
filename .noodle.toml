mode = "auto"

[concurrency]
max_concurrency = 2

[routing.defaults]
provider = "claude"
model = "claude-sonnet-5-5"

[routing.roles]
scheduler = { provider = "claude", model = "claude-haiku-5-5" }
debrief   = { provider = "claude", model = "claude-haiku-5-5" }
builder   = { provider = "claude", model = "claude-sonnet-5-5" }
explorer  = { provider = "claude", model = "claude-sonnet-5-5" }
reviewer  = { provider = "claude", model = "claude-sonnet-5-5" }
adversary = { provider = "claude", model = "claude-sonnet-5-5" }
planner   = { provider = "claude", model = "claude-opus-5-5" }
verifier  = { provider = "claude", model = "claude-opus-5-5" }

[skills]
paths = [".agents/skills"]

[agents.claude]
path = "~/.claude"
args = ["--dangerously-skip-permissions", "--verbose"]

[adapters.backlog]
skill = "todo"

[adapters.backlog.scripts]
sync = "adapters/github/backlog-sync"
add = "adapters/github/backlog-add"
done = "adapters/github/backlog-done"
edit = "adapters/github/backlog-edit"
stop = "adapters/github/backlog-stop"
stopped = "adapters/github/backlog-stopped"

[landing]
mode = "pr"
close_issues = true

[runtime]
default = "orca"

[runtime.orca]

[server]
port = 3003
